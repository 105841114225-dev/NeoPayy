<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeoPay – Dompet Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f8;--card:#fff;--ink:#12233f;--mute:#6b7a93;--line:#e2e8f2;--brand:#1b6ef3;--hero:#12233f;--heroink:#fff;--good:#14a37a;--bad:#e5533d;--track:#e6ecf5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1424;--card:#15203a;--ink:#e9eefb;--mute:#93a1bd;--line:#243256;--brand:#5b97ff;--hero:#1b2c52;--track:#243256}}
:root[data-theme="dark"]{--bg:#0c1424;--card:#15203a;--ink:#e9eefb;--mute:#93a1bd;--line:#243256;--brand:#5b97ff;--hero:#1b2c52;--track:#243256}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}
.logo{width:144px;height:84px;overflow:hidden;border-radius:8px;flex:none}
.logo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 100%}
.live{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.live b{width:8px;height:8px;border-radius:50%;background:var(--good);animation:p 2s infinite}
@keyframes p{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.live b{animation:none}}
.hero{background:var(--hero);color:var(--heroink);border-radius:20px;padding:24px;display:grid;gap:20px;grid-template-columns:1fr auto;align-items:end}
.hero small{opacity:.75}
.bal{font-size:clamp(32px,6vw,48px);font-weight:800;letter-spacing:-1px;line-height:1.1;margin:4px 0}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.acts button{background:rgba(255,255,255,.12);border:0;border-radius:14px;padding:12px 16px;cursor:pointer;color:#fff;font-weight:700;font-size:14px}
.acts button:hover{background:rgba(255,255,255,.22)}
.grid{display:grid;gap:16px;margin-top:16px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c12{grid-column:span 12}
@media (max-width:820px){.c4,.c5,.c6,.c7{grid-column:span 12}.hero{grid-template-columns:1fr}}
h2{font-size:15px;margin:0 0 12px;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.top h2{margin:0}
.seg{display:inline-flex;background:var(--track);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:700}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sum div{background:var(--bg);border-radius:12px;padding:12px}
.sum span{font-size:12px;color:var(--mute);display:block}
.sum b{font-size:clamp(14px,2.4vw,18px)}
.in{color:var(--good)}.out{color:var(--bad)}
.big{font-size:22px;font-weight:800;letter-spacing:-.5px}
.mute{color:var(--mute);font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.link{background:none;border:0;color:var(--brand);font-weight:700;cursor:pointer;padding:0;font-size:13px}
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut svg{width:170px;height:170px;flex:none}
.leg{flex:1;min-width:150px;display:grid;gap:8px;font-size:13px}
.leg div{display:flex;align-items:center;gap:8px}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.leg span{margin-left:auto;font-weight:700}
.chart{overflow-x:auto}
.chart svg{width:100%;min-width:320px;height:auto}
.tx{list-style:none;margin:0;padding:0}
.tx li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tx li:first-child{border-top:0}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.tx .m{flex:1;min-width:0}
.tx .m b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-weight:700;font-size:14px;white-space:nowrap}
dialog{border:0;border-radius:20px;padding:24px;width:min(400px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(8,14,30,.55)}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.row{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;padding:12px;border-radius:12px;border:0;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}
.btn.g{background:var(--track);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}.sh{display:grid;grid-template-columns:1fr 1.4fr;gap:20px;align-items:center}@media (max-width:820px){.sh{grid-template-columns:1fr}}.stk{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--track);margin-bottom:12px}.stk i{display:block}.chk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.chk div{background:var(--bg);border-radius:12px;padding:10px}.chk span{display:block;font-size:12px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:500;font-size:13px}.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:12px}.pr{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px;justify-items:start}.pr .btn{width:100%;flex:none;padding:8px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><img src="wew.jpeg" alt="NeoPay"></div>
  <div class="live"><b></b><span id="clock">Memuat…</span></div>
</header>

<section class="hero" aria-label="Saldo">
  <div>
    <small>Saldo e-wallet</small>
    <div class="bal" id="bal" aria-live="polite">Rp0</div>
    <small id="netNote"></small>
  </div>
  <div class="acts">
    <button data-a="topup">Isi saldo</button>
    <button data-a="send">Kirim</button>
    <button data-a="pay">Bayar</button>
    <button data-a="save">Tabung</button>
  </div>
</section>

<div class="grid"><section class="card c12" id="shield"></section>
  <section class="card c12">
    <div class="top"><h2>Pemasukan vs pengeluaran</h2>
      <div class="seg" id="pSeg" role="group" aria-label="Periode">
        <button data-p="day" aria-pressed="false">Hari ini</button>
        <button data-p="week" aria-pressed="false">Minggu</button>
        <button data-p="month" aria-pressed="true">Bulan</button>
      </div></div>
    <div class="sum" id="sum"></div>
  </section>

  <section class="card c4"><h2>Sisa budget bulan ini</h2><div id="cBudget"></div></section>
  <section class="card c4"><h2>Pengeluaran terbesar</h2><div id="cTop"></div></section>
  <section class="card c4"><h2>Tabungan terkumpul</h2><div id="cSave"></div></section>

  <section class="card c5"><h2>Pengeluaran per kategori (bulan ini)</h2><div class="donut" id="donut"></div></section>
  <section class="card c7">
    <div class="top"><h2>Tren pemasukan & pengeluaran</h2>
      <div class="seg" id="nSeg" role="group" aria-label="Rentang bulan">
        <button data-n="3" aria-pressed="false">3 bulan</button>
        <button data-n="6" aria-pressed="true">6 bulan</button>
      </div></div>
    <div class="chart" id="trend"></div>
  </section>

  <section class="card c12" id="shop"></section><section class="card c12"><h2>Riwayat transaksi</h2><ul class="tx" id="hist"></ul></section>
</div>
</div>

<dialog id="dlg"><form method="dialog" id="frm"></form></dialog>
<div id="toast" role="status"></div>

<script>
const KEY='dompetku-v1',CATS={Makanan:'#e5533d',Transport:'#f2b134',Belanja:'#8a5cf6',Tagihan:'#1b6ef3',Hiburan:'#e6479b',Transfer:'#14a37a',Kuliah:'#0aa5c2'};
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const $=s=>document.querySelector(s),fmt=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NEED=['Makanan','Transport','Tagihan','Kuliah'],LIM={Makanan:1200000,Transport:500000,Belanja:800000,Tagihan:900000,Hiburan:300000,Kuliah:1000000};let period='month',range=6,shopCat='Makanan',S=load();

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seed(){
  const r=rng(7),now=new Date(),tx=[],R={Makanan:[15,90],Transport:[10,80],Belanja:[60,450],Tagihan:[100,500],Hiburan:[50,200],Transfer:[50,300]};
  const T={Makanan:['Warung Padang','Kopi Kenangan','GoFood'],Transport:['Gojek','KRL Commuter','TransJakarta'],Belanja:['Tokopedia','Shopee','Alfamart'],Tagihan:['Listrik PLN','Internet','Pulsa'],Hiburan:['Netflix','Bioskop','Spotify'],Transfer:['Transfer ke Rani','Transfer ke Dimas']};
  const pool=['Makanan','Makanan','Makanan','Transport','Transport','Belanja','Belanja','Tagihan','Hiburan','Transfer'];
  let id=1;
  for(let m=5;m>=0;m--){
    const b=new Date(now.getFullYear(),now.getMonth()-m,1),last=m?new Date(b.getFullYear(),b.getMonth()+1,0).getDate():now.getDate();
    tx.push({id:id++,t:+new Date(b.getFullYear(),b.getMonth(),1,9),type:'in',cat:'Gaji',title:'Gaji bulanan',amt:8500000});
    if(r()>.5&&last>10)tx.push({id:id++,t:+new Date(b.getFullYear(),b.getMonth(),10,14),type:'in',cat:'Freelance',title:'Proyek freelance',amt:1200000});
    const n=m?16:Math.max(4,Math.round(last*.7));
    for(let i=0;i<n;i++){
      const c=pool[Math.floor(r()*pool.length)],[lo,hi]=R[c],d=1+Math.floor(r()*last),t=Math.min(+new Date(b.getFullYear(),b.getMonth(),d,8+Math.floor(r()*12)),+now-60000);
      tx.push({id:id++,t,type:'out',cat:c,title:T[c][Math.floor(r()*T[c].length)],amt:Math.round((lo+r()*(hi-lo))*1000/1000)*1000});
    }
  }
  tx.sort((a,b)=>b.t-a.t);
  return{bal:2350000,saved:4200000,goal:10000000,budget:4500000,tx,id}
}
function mig(s){if(s.pw==null){s.pw=Math.round(s.bal*.45/1000)*1000;s.ps=Math.round(s.bal*.2/1000)*1000;s.pf=s.bal-s.pw-s.ps}return s}
function load(){try{const v=localStorage.getItem(KEY);if(v)return mig(JSON.parse(v))}catch(e){}return mig(seed())}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function inRange(t){
  const n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const s=period==='day'?d0:period==='week'?new Date(+d0-6*864e5):new Date(n.getFullYear(),n.getMonth(),1);
  return t>=+s
}
const sumBy=(f,type)=>S.tx.filter(x=>x.type===type&&f(x)).reduce((a,x)=>a+x.amt,0);
const monthStart=()=>{const n=new Date();return+new Date(n.getFullYear(),n.getMonth(),1)};
const inMonthOffset=(o)=>{const n=new Date(),a=+new Date(n.getFullYear(),n.getMonth()-o,1),b=+new Date(n.getFullYear(),n.getMonth()-o+1,1);return x=>x.t>=a&&x.t<b};

function render(){
  $('#bal').textContent=fmt(S.bal);
  const inc=sumBy(x=>inRange(x.t),'in'),exp=sumBy(x=>inRange(x.t),'out'),net=inc-exp;
  $('#sum').innerHTML=`<div><span>Pemasukan</span><b class="in">${fmt(inc)}</b></div><div><span>Pengeluaran</span><b class="out">${fmt(exp)}</b></div><div><span>Selisih</span><b class="${net>=0?'in':'out'}">${fmt(net)}</b></div>`;
  $('#netNote').textContent=net>=0?'Periode ini kamu masih surplus.':'Periode ini pengeluaran lebih besar dari pemasukan.';

  const mf=x=>x.t>=monthStart(),mexp=sumBy(mf,'out'),left=S.budget-mexp,pct=Math.min(100,mexp/S.budget*100);
  $('#cBudget').innerHTML=`<div class="big ${left<0?'out':''}">${fmt(left)}</div><div class="bar"><i style="width:${pct}%;background:${pct>90?'var(--bad)':'var(--brand)'}"></i></div><div class="mute">Terpakai ${fmt(mexp)} dari ${fmt(S.budget)} · ${Math.round(pct)}%</div><p style="margin:10px 0 0"><button class="link" data-a="budget">Atur budget</button></p>`;

  const cat={};S.tx.filter(x=>x.type==='out'&&mf(x)).forEach(x=>cat[x.cat]=(cat[x.cat]||0)+x.amt);
  const ents=Object.entries(cat).sort((a,b)=>b[1]-a[1]);
  if(ents.length){const[n,v]=ents[0];$('#cTop').innerHTML=`<div class="big">${esc(n)}</div><div class="big out" style="font-size:18px">${fmt(v)}</div><div class="mute">${Math.round(v/mexp*100)}% dari total pengeluaran bulan ini</div>`}
  else $('#cTop').innerHTML='<div class="mute">Belum ada pengeluaran bulan ini.</div>';

  const sp=Math.min(100,S.saved/S.goal*100);
  $('#cSave').innerHTML=`<div class="big">${fmt(S.saved)}</div><div class="bar"><i style="width:${sp}%;background:var(--good)"></i></div><div class="mute">Target ${fmt(S.goal)} · ${Math.round(sp)}%</div><p style="margin:10px 0 0"><button class="link" data-a="save">Tabung sekarang</button></p>`;

  donut(ents,mexp);trend();hist();shield();shopR();
}
function donut(ents,tot){
  if(!ents.length){$('#donut').innerHTML='<div class="mute">Belum ada data.</div>';return}
  let cum=0,seg='';
  ents.forEach(([n,v])=>{const p=v/tot*100;seg+=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${CATS[n]||'#999'}" stroke-width="7" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-cum}"/>`;cum+=p});
  $('#donut').innerHTML=`<svg viewBox="0 0 42 42" role="img" aria-label="Diagram pengeluaran per kategori"><g transform="rotate(-90 21 21)">${seg}</g><text x="21" y="20.5" text-anchor="middle" font-size="3.4" font-weight="800" fill="var(--ink)">${fmt(tot).replace('Rp','Rp ')}</text><text x="21" y="25" text-anchor="middle" font-size="2.4" fill="var(--mute)">total</text></svg><div class="leg">${ents.map(([n,v])=>`<div><i style="background:${CATS[n]||'#999'}"></i>${esc(n)}<span>${fmt(v)}</span></div>`).join('')}</div>`;
}
function trend(){
  const rows=[];for(let o=range-1;o>=0;o--){const f=inMonthOffset(o),d=new Date(new Date().getFullYear(),new Date().getMonth()-o,1);rows.push({l:MON[d.getMonth()],i:sumBy(f,'in'),e:sumBy(f,'out')})}
  const mx=Math.max(...rows.map(r=>Math.max(r.i,r.e)),1),W=600,H=230,pad=28,bw=Math.min(34,(W/rows.length)/3),gw=W/rows.length;
  let s='';
  rows.forEach((r,k)=>{const x=k*gw+gw/2,hi=r.i/mx*(H-pad-24),he=r.e/mx*(H-pad-24);
    s+=`<rect x="${x-bw-2}" y="${H-pad-hi}" width="${bw}" height="${hi}" rx="4" fill="var(--good)"><title>${r.l} pemasukan ${fmt(r.i)}</title></rect><rect x="${x+2}" y="${H-pad-he}" width="${bw}" height="${he}" rx="4" fill="var(--bad)"><title>${r.l} pengeluaran ${fmt(r.e)}</title></rect><text x="${x}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--mute)">${r.l}</text><text x="${x+bw/2+2}" y="${H-pad-he-5}" text-anchor="middle" font-size="10" fill="var(--mute)">${(r.e/1e6).toFixed(1)}jt</text>`});
  $('#trend').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tren pemasukan dan pengeluaran">${s}</svg><div class="mute"><span class="in">■</span> Pemasukan &nbsp; <span class="out">■</span> Pengeluaran</div>`;
}
function hist(){
  $('#hist').innerHTML=S.tx.slice(0,10).map(x=>{const d=new Date(x.t),c=x.type==='in'?'#14a37a':x.type==='sav'?'#1b6ef3':(CATS[x.cat]||'#999'),sg=x.type==='in'?'+':'-';
    return`<li><div class="ic" style="background:${c}">${esc(x.cat[0])}</div><div class="m"><b>${esc(x.title)}</b><span class="mute">${esc(x.cat)} · ${d.getDate()} ${MON[d.getMonth()]}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</span></div><div class="a ${x.type==='in'?'in':x.type==='out'?'out':''}">${sg}${fmt(x.amt)}</div></li>`}).join('');
}

/* Form dialog */
const dlg=$('#dlg'),frm=$('#frm');
function form(title,fields,btn,ok){
  frm.innerHTML=`<h2 style="font-size:18px;margin:0">${title}</h2>`+fields.map(f=>`<label for="f_${f.id}">${f.label}</label>`+(f.opts?`<select id="f_${f.id}">${f.opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:`<input id="f_${f.id}" type="${f.type||'text'}" ${f.type==='number'?'min="0" step="any" inputmode="numeric"':''} value="${f.v||''}" ${f.req?'required':''}>`)).join('')+`<div class="row"><button type="button" class="btn g" id="x">Batal</button><button class="btn" value="ok">${btn}</button></div>`;
  $('#x').onclick=()=>dlg.close();
  frm.onsubmit=e=>{e.preventDefault();const v={};fields.forEach(f=>v[f.id]=$('#f_'+f.id).value);if(ok(v)!==false)dlg.close()};
  dlg.showModal();
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2400)}
function add(type,cat,title,amt){S.tx.unshift({id:S.id++,t:Date.now(),type,cat,title,amt});save();render()}
function chk(a){if(!(a>0)){toast('Masukkan nominal yang valid');return false}if(a>S.bal){toast('Saldo tidak cukup');return false}return true}
const A={
 topup(){form('Isi saldo',[{id:'m',label:'Sumber dana',opts:['Bank BCA','Bank Mandiri','Bank BRI','Minimarket']},{id:'a',label:'Nominal',type:'number',req:1}],'Isi saldo',v=>{const a=+v.a;if(!(a>=1000)){toast('Minimal Rp1.000');return false}S.bal+=a;S.pf+=a;add('in','Top Up','Isi saldo dari '+v.m,a);toast('Saldo bertambah '+fmt(a));setTimeout(()=>allocate(a),60)})},
 send(){form('Kirim uang',[{id:'to',label:'Penerima',opts:['Rani Putri','Dimas Pratama','Siti Aminah','Budi Santoso']},{id:'a',label:'Nominal',type:'number',req:1},{id:'n',label:'Catatan (opsional)'}],'Kirim',v=>{const a=+v.a;return spend(a,'Transfer','Kirim ke '+v.to+(v.n?' – '+v.n:''))})},
 pay(){const P={'Listrik PLN':'Tagihan','Internet IndiHome':'Tagihan','Pulsa & data':'Tagihan','Air PDAM':'Tagihan','Bayar QRIS warung/kafe':'Makanan','Ojek online':'Transport','Belanja online':'Belanja','Streaming':'Hiburan','UKT / biaya kuliah':'Kuliah'};
  form('Bayar',[{id:'p',label:'Bayar untuk',opts:Object.keys(P)},{id:'a',label:'Nominal',type:'number',req:1}],'Bayar',v=>{const a=+v.a;return spend(a,P[v.p],v.p)})},
 save(){form('Tabung',[{id:'a',label:'Pindahkan ke tabungan',type:'number',req:1}],'Tabung',v=>{const a=+v.a;if(!(a>0)||a>S.ps+S.pf){toast('Dana tabungan/bebas tidak cukup');return false}const x=Math.min(S.ps,a);S.ps-=x;S.pf-=a-x;S.bal-=a;S.saved+=a;add('sav','Tabungan','Pindah ke tabungan',a);toast('Tabungan bertambah')})},
 budget(){form('Atur budget bulanan',[{id:'a',label:'Budget per bulan',type:'number',v:S.budget,req:1}],'Simpan',v=>{const a=+v.a;if(!(a>=1000)){toast('Nominal tidak valid');return false}S.budget=a;save();render();toast('Budget disimpan')})}
};
let pend=null;
const PR=[['Makanan','Paket nasi ayam',25000],['Makanan','Kopi susu literan',85000],['Makanan','Belanja sembako',150000],['Transport','Isi saldo KRL',50000],['Transport','Voucher ojek online',100000],['Transport','Isi bensin',75000],['Belanja','Earphone bluetooth',250000],['Belanja','Kaos polos',120000],['Belanja','Sepatu sneakers',450000],['Hiburan','Tiket bioskop',50000],['Hiburan','Langganan Netflix',54000],['Hiburan','Voucher game',100000],['Tagihan','Token listrik',100000],['Tagihan','Paket internet',150000],['Tagihan','Pulsa 50 ribu',50000],['Kuliah','Buku kuliah',180000],['Kuliah','Print & fotokopi',30000],['Kuliah','Cicilan UKT',750000]];
function apply(a,w,t){S.pf-=w+t;S.pw+=w;S.ps+=t;save();render()}
dlg.addEventListener('close',()=>{if(pend){const a=pend;pend=null;apply(a,Math.round(a*.5),Math.round(a*.2));toast('Alokasi default 50/20/30 dipakai')}});
function allocate(a){pend=a;frm.innerHTML=`<h2 style='font-size:18px;margin:0'>Alokasikan saldo masuk</h2><p class='mute' style='margin:6px 0 0'>Bagi ${fmt(a)} ke beberapa pos sebelum terpakai.</p><label for='aw'>Kebutuhan wajib (makan, transport, kuliah)</label><input id='aw' type='number' min='0' value='${Math.round(a*.5)}'><label for='at'>Target tabungan</label><input id='at' type='number' min='0' value='${Math.round(a*.2)}'><p id='ab' style='font-weight:700'></p><div class='row'><button type='button' class='btn g' id='x'>Pakai 50 / 20 / 30</button><button class='btn'>Simpan alokasi</button></div>`;const up=()=>{if(!$('#aw'))return;const f=a-(+$('#aw').value||0)-(+$('#at').value||0);$('#ab').textContent='Uang bebas pakai: '+fmt(f);$('#ab').className=f<0?'out':'in'};frm.oninput=up;up();$('#x').onclick=()=>dlg.close();frm.onsubmit=e=>{e.preventDefault();const w=+$('#aw').value||0,t=+$('#at').value||0;if(w<0||t<0||w+t>a){toast('Total alokasi melebihi saldo masuk');return}pend=null;apply(a,w,t);dlg.close();toast('Alokasi disimpan')};dlg.showModal()}
A.alloc=()=>form('Atur alokasi saldo',[{id:'w',label:'Kebutuhan wajib',type:'number',v:S.pw,req:1},{id:'t',label:'Tabungan',type:'number',v:S.ps,req:1}],'Simpan',v=>{const w=+v.w,t=+v.t;if(w<0||t<0||w+t>S.bal){toast('Total melebihi saldo '+fmt(S.bal));return false}S.pw=w;S.ps=t;S.pf=S.bal-w-t;save();render();toast('Uang bebas pakai: '+fmt(S.pf))});
function spend(a,cat,title){if(!(a>0)){toast('Masukkan nominal yang valid');return false}if(a>S.pw+S.pf){toast('Uang yang bisa dipakai tidak cukup');return false}setTimeout(()=>shieldDlg(a,cat,title,NEED.includes(cat)),60);return true}
function commit(a,cat,title,need){let r=a;if(need){const x=Math.min(S.pw,r);S.pw-=x;S.pf-=r-x}else{const x=Math.min(S.pf,r);S.pf-=x;S.pw-=r-x}S.bal-=a;add('out',cat,title,a)}
function shieldDlg(a,cat,title,need){const over=sumBy(x=>x.cat===cat&&x.t>=monthStart(),'out')+a>(LIM[cat]||1e12),bal=need?S.pw:S.pf,lab=need?'Kebutuhan wajib':'Uang bebas pakai',after=bal-a,bad=after<0;const note=bad?(need?'Melebihi pos kebutuhan wajib; kekurangannya diambil dari uang bebas pakai.':'Melebihi uang bebas pakai. Kalau dilanjutkan, uang kebutuhan wajib akan terpakai.'):`Pembelian ini menyisakan ${fmt(after)} dari ${lab.toLowerCase()}.`;frm.oninput=null;frm.innerHTML=`<h2 style='font-size:18px;margin:0'>Cek Smart Money Shield</h2><p class='mute' style='margin:6px 0 0'>${esc(title)} · ${esc(cat)} · <b>${fmt(a)}</b></p><div class='chk'><div><span class='mute'>${lab} sekarang</span><b>${fmt(bal)}</b></div><div><span class='mute'>Setelah bayar</span><b class='${bad?'out':'in'}'>${fmt(after)}</b></div></div><p class='${bad?'out':''}' style='font-weight:700;margin:0'>${note}</p>${over?`<p class='out' style='margin:8px 0 0'>Melewati batas kategori ${esc(cat)} bulan ini (${fmt(LIM[cat])}).</p>`:''}<div class='row'><button type='button' class='btn g' id='x'>Batalkan</button><button class='btn'>${bad||over?'Tetap lanjut':'Konfirmasi'}</button></div>`;$('#x').onclick=()=>dlg.close();frm.onsubmit=e=>{e.preventDefault();commit(a,cat,title,need);dlg.close();toast('Transaksi berhasil')};dlg.showModal()}
function shield(){const T=(S.pw+S.ps+S.pf)||1,p=v=>Math.max(0,v/T*100);$('#shield').innerHTML=`<div class='top'><h2>Smart Money Shield</h2><button class='link' data-a='alloc'>Atur alokasi</button></div><div class='sh'><div><span class='mute'>Uang bebas pakai</span><div class='big ${S.pf<0?'out':'in'}'>${fmt(S.pf)}</div><div class='mute'>dari saldo ${fmt(S.bal)}, setelah kebutuhan wajib dan tabungan diamankan</div></div><div><div class='stk'><i style='width:${p(S.pw)}%;background:var(--brand)'></i><i style='width:${p(S.ps)}%;background:var(--good)'></i><i style='width:${p(S.pf)}%;background:#f2b134'></i></div><div class='leg'><div><i style='background:var(--brand)'></i>Kebutuhan wajib<span>${fmt(S.pw)}</span></div><div><i style='background:var(--good)'></i>Tabungan<span>${fmt(S.ps)}</span></div><div><i style='background:#f2b134'></i>Bebas pakai<span>${fmt(S.pf)}</span></div></div></div></div><label for='sim'>Cek sebelum beli</label><input id='sim' type='number' min='0' placeholder='Masukkan harga barang, mis. 250000'><p id='simr' class='mute' style='margin:8px 0 0'>Lihat dampaknya ke uang bebas pakai sebelum kamu membayar.</p>`}
function shopR(){const sp=sumBy(x=>x.cat===shopCat&&x.t>=monthStart(),'out'),lim=LIM[shopCat],pc=Math.min(100,sp/lim*100);$('#shop').innerHTML=`<div class='top'><h2>Belanja sesuai kategori</h2></div><div class='chips'>${Object.keys(CATS).filter(c=>c!=='Transfer').map(c=>`<button class='chip' data-s='${c}' aria-pressed='${c===shopCat}'>${c}</button>`).join('')}</div><div class='mute'>${NEED.includes(shopCat)?'Kebutuhan wajib: dibayar dari pos wajib':'Keinginan: dibayar dari uang bebas pakai'} · terpakai ${fmt(sp)} dari batas ${fmt(lim)} bulan ini</div><div class='bar'><i style='width:${pc}%;background:${pc>90?'var(--bad)':CATS[shopCat]}'></i></div><div class='prods'>${PR.map((p,i)=>p[0]===shopCat?`<div class='pr'><div class='ic' style='background:${CATS[shopCat]}'>${esc(p[1][0])}</div><b>${esc(p[1])}</b><span class='mute'>${fmt(p[2])}</span><button class='btn' data-b='${i}'>Beli</button></div>`:'').join('')}</div>`}
document.addEventListener('click',e=>{const c=e.target.closest('[data-s]');if(c){shopCat=c.dataset.s;shopR();return}const b=e.target.closest('[data-b]');if(b){const p=PR[+b.dataset.b];spend(p[2],p[0],p[1])}});
document.addEventListener('input',e=>{if(e.target.id!=='sim')return;const v=+e.target.value,r=$('#simr'),a=S.pf-v;if(!(v>0)){r.className='mute';r.style.fontWeight=400;r.textContent='Lihat dampaknya ke uang bebas pakai sebelum kamu membayar.';return}r.className=a>=0?'in':'out';r.style.fontWeight=700;r.textContent=a>=0?`Aman: sisa uang bebas pakai ${fmt(a)} dari ${fmt(S.pf)}.`:`Melebihi uang bebas pakai ${fmt(-a)}. Uang kebutuhan wajib akan terpakai.`});
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');if(a)A[a.dataset.a]();
  const p=e.target.closest('[data-p]');if(p){period=p.dataset.p;document.querySelectorAll('#pSeg button').forEach(b=>b.setAttribute('aria-pressed',b===p));render()}
  const n=e.target.closest('[data-n]');if(n){range=+n.dataset.n;document.querySelectorAll('#nSeg button').forEach(b=>b.setAttribute('aria-pressed',b===n));trend()}
});
window.addEventListener('storage',e=>{if(e.key===KEY){S=load();render()}});
setInterval(()=>{$('#clock').textContent='Diperbarui '+new Date().toLocaleTimeString('id-ID')},1000);
render();
</script>
</body>
</html>
